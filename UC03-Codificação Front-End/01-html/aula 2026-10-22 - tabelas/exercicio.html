<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Semanal</title>
</head>
<body>
    <table>
        <caption>Cardápio Semanal Refeitório</caption>
        <thead>
            <tr>
                <th scope="col">Dias da Semana</th>
                <th scope="col">Café</th>
                <th scope="col">Almoço</th>
                <th scope="col">Jantar</th>
            </tr>
            <tbody>
                <tr>
                    <td>Segunda-Feira</td>
                    <td>Pão com Ovo</td>
                    <td>Strogonoff</td>
                    <td>Pizza</td>
                </tr>
                <tr>
                    <td>Terça-Feira</td>
                    <td>Tapioca</td>
                    <td>Rocambole</td>
                    <td>Feijoada</td>
                </tr>
                <tr>
                    <td>Quarta-Feira</td>
                    <td>Panquecas</td>
                    <td>Lasanha</td>
                    <td>Empanados</td>
                </tr>
                <tr>
                    <td>Quinta-Feira</td>
                    <td colspan="3">FERIADO</td>
                </tr>
            </tbody>
        </thead>
    </table>
</body>
</html>
