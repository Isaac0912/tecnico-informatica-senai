<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <table> <!--Começar a tabela-->
        <caption>Horário das Aulas da Semana</caption> <!--Título da tabela-->
        <thead> <!--Cabeçalho-->
            <tr> <!--Linha horizontal-->
                <th scope="col">Dia da Semana</th> <!--Coluna/célula do cabeçalho-->
                <th scope="col">Horário</th>
                <th scope="col">Unidade Curricular</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Segunda-Feira</td>
                <td>19:30 - 22:30</td>
                <td>Projetos de Front-End</td>
            </tr>
            <tr>
                <td>Terça-Feira</td>
                <td>19:30 - 22:30</td>
                <td></td>
            </tr>
            <tr>
                <td>Quarta-Feira</td>
                <td>19:30 - 22:30</td>
                <td>Codificação para Front-End</td>
            </tr>
            <tr>
                <td>Quinta-Feira</td>
                <td>19:30 - 22:30</td>
                <td>Codificação para Front-End</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Intervalo: 20:00 - 20:15</td>
            </tr>
            
        </tfoot>
    </table>
</body>
</html>
