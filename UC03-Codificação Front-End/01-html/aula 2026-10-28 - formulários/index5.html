<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <label for="idade">Idade</label>
    <input type="number" id="idade" name="idade" min="0" max="100">
    <br>
    <label for="dataNascimento">Data de Nascimento</label>
    <input type="date" id="dataNascimento" name="DataDeNascimento">
    <br>
    <label for="curriculo">Currículo (PDF)</label>
    <input type="file" id="curriculo" name="curriculo" accept=".pdf">
    <br>
    <h3>Checkbox</h3>
    <p>Quais tecnologias você já conhece?</p>
    <label>
        <input type="checkbox" name="tecnologia" value="html">
        HTML
    </label>
    <label>
        <input type="checkbox" name="tecnologia" value="css">
        CSS
    </label>
    <label>
        <input type="checkbox" name="tecnologia" value="js">
        JavaScript
    </label>
    <br>
    <h3>Rádio</h3>
    <p>Qual o turno do seu curso?</p>
    <label><input type="radio" name="turno" value="matutino">Matutino</label>
    <label><input type="radio" name="turno" value="matutino">Vespertino</label>
    <label><input type="radio" name="turno" value="matutino" checked>Noturno</label>
    <br>
    <h3>Caixas de Seleção</h3>
    <label for="curso">Curso</label>
    <select id="curso" name="curso">
        <option value="">Selecione...</option>        
        <option value="informaticaParaInternet">Informatica Para Internet</option>        
        <option value="redeDeComputadores">Rede de Computadores</option>
        <optgroup label="Gestão">
            <option value="administracao">Administração</option>
            <option value="CienciasContabeis">Ciência da Contábeis</option>
        </optgroup>
    </select>
    <br>
    <h3>Texto Longo</h3>
    <label for="mensagem">Mensagem</label>
    <textarea id="mensagem" name="mensagem" rows="5" maxlength="5000" minlength="10" placeholder="Digite uma mensagem"></textarea>
    <br><br>
    <label for="cidade">Cidade</label>
    <input list="cidades" id="cidade" name="cidade">
    <datalist id="cidades">
        <option value="Chapecó"></option>
        <option value="Florianópolis"></option>
        <option value="Joinville"></option>
        <option value="Blumenau"></option>
    </datalist>
    <br><br>
    <fieldset> <!--rádio e checkbox-->
        <legend>Forma de Contato Preferida</legend>
        <label><input type="radio" name="contato" value="email">E-mail</label>
        <label><input type="radio" name="contato" value="telefone">Telefone</label>
    </fieldset>
</body>
</html>
